{% extends "base.html" %}
{% block title %}Create account · {{ brand_name }}{% endblock %}
{% block content %}
<section class="auth shell">
  <div class="auth-card">
    <span class="eyebrow">Get started</span>
    <h1>Create your account.</h1>
    <p>₦{{ welcome_bonus }} welcome balance is credited when you join.</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Full name<input name="name" required autocomplete="name"></label>
      <label>Email<input type="email" name="email" required autocomplete="email"></label>
      <label>Password<input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
      <label>Referral code <span class="muted">(optional)</span>
        <input name="referral_code" value="{{ prefill_ref or '' }}">
      </label>
      <button class="button primary full" type="submit">Create account</button>
    </form>
    <p class="small">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p>
  </div>
</section>
{% endblock %}
