{% extends "base.html" %}
{% block title %}Login · {{ brand_name }}{% endblock %}
{% block content %}
<section class="auth shell">
  <div class="auth-card">
    <span class="eyebrow">Welcome back</span>
    <h1>Sign in.</h1>
    <p>Access your Brent dashboard securely.</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Email<input type="email" name="email" required autocomplete="email"></label>
      <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
      <button class="button primary full" type="submit">Sign in</button>
    </form>
    <p class="small">Don't have an account? <a href="{{ url_for('register') }}">Create one</a></p>
  </div>
</section>
{% endblock %}
