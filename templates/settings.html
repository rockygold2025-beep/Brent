{% extends "base.html" %}
{% block title %}Settings · {{ brand_name }}{% endblock %}
{% block content %}
<section class="auth shell">
  <div class="auth-card" style="width:min(440px,100%)">
    <span class="eyebrow">Security</span>
    <h1>Change password.</h1>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Current password<input type="password" name="current_password" required autocomplete="current-password"></label>
      <label>New password<input type="password" name="new_password" required minlength="8" autocomplete="new-password"></label>
      <label>Confirm new password<input type="password" name="confirm_password" required minlength="8" autocomplete="new-password"></label>
      <button class="button primary full" type="submit">Update password</button>
    </form>
    <p class="small"><a href="{{ url_for('profile') }}">← Back to profile</a></p>
  </div>
</section>
{% endblock %}
